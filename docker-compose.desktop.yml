# Venus avec Docker Desktop (Windows ou Mac).
#
# 1. Copiez .env.example en .env et indiquez vos dossiers de vidéos
# 2. docker compose -f docker-compose.desktop.yml up -d --build
# 3. Ouvrez http://localhost:8096
#
# Docker Desktop fait tourner les conteneurs dans une petite machine virtuelle :
#  - la carte graphique du PC / du Mac n'est pas accessible : la conversion se fait au processeur
#    (l'installation sans Docker, scripts/install-windows.ps1 ou scripts/install-macos.sh, utilise la carte graphique) ;
#  - Venus ne voit pas tout seul les appareils de la maison : renseignez LAN_SUBNET dans .env
#    pour la recherche automatique des NAS, ou saisissez leur adresse à la main.
services:
  venus:
    build: .
    image: venus:latest
    container_name: venus
    restart: unless-stopped
    ports:
      - "${VENUS_PORT:-8096}:8096"
    cap_add:
      - SYS_ADMIN          # montage des partages réseau depuis l'interface
      - DAC_READ_SEARCH
    security_opt:
      - apparmor:unconfined
      # Aucun programme du conteneur ne peut gagner de droits supplémentaires (setuid…)
      - no-new-privileges:true
    depends_on:
      venus-db:
        condition: service_healthy
    environment:
      - TZ=${TZ:-Europe/Paris}
      - PORT=8096
      - VENUS_DATABASE_URL=postgres://venus:${VENUS_DB_PASSWORD:?mot de passe de la base absent de .env}@venus-db:5432/venus
      - LAN_SUBNET=${LAN_SUBNET:-192.168.1}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
    volumes:
      - ./config:/config
      - venus-transcode:/transcode                       # volume Docker : bien plus rapide qu'un dossier Windows
      - "${VENUS_MOVIES:-./media/films}:/media/films"
      - "${VENUS_SHOWS:-./media/series}:/media/series"
      - "${VENUS_ANIME:-./media/animes}:/media/animes"
      - "${VENUS_CLIPS:-./media/clips}:/media/clips"

  # Base de données de Venus (PostgreSQL), seulement joignable par Venus
  venus-db:
    image: postgres:18-alpine
    container_name: venus-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=venus
      - POSTGRES_DB=venus
      - POSTGRES_PASSWORD=${VENUS_DB_PASSWORD:?mot de passe de la base absent de .env}
    volumes:
      - venus-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venus -d venus"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  venus-transcode:
  venus-db:
