  <script>/* Filet de sécurité : si l'interface ne démarre pas, l'écran de chargement explique pourquoi et propose de réparer (au lieu de rester sur le logo) */(function(){var err="";function note(m){if(!err&&m)err=String(m).slice(0,240);}window.addEventListener("error",function(e){var t=e.target;if(t&&t!==window&&(t.src||t.href))note("Fichier non chargé : "+String(t.src||t.href).replace(location.origin,""));else note(e.message);},true);window.addEventListener("unhandledrejection",function(e){var r=e.reason;note(r&&r.message?r.message:r);});function repair(){var p=[];try{if(navigator.serviceWorker)p.push(navigator.serviceWorker.getRegistrations().then(function(l){return Promise.all(l.map(function(r){return r.unregister();}));}));}catch(x){}try{if(window.caches)p.push(caches.keys().then(function(k){return Promise.all(k.map(function(n){return caches.delete(n);}));}));}catch(x){}try{sessionStorage.clear();localStorage.removeItem("vn_theme_vars");}catch(x){}Promise.all(p).catch(function(){}).then(function(){location.replace("/");});}function check(){var b=document.querySelector(".boot");if(!b||window.__vnBooted)return;var n=b.querySelector(".boot-note");if(!n)return;b.classList.add("stuck");n.textContent="";var m=document.createElement("p");m.textContent="Le chargement est bloqué."+(err?" "+err:" Le serveur ne répond pas, ou d’anciens fichiers sont restés en mémoire.");var r1=document.createElement("button");r1.className="btn btn-play";r1.textContent="Recharger";r1.onclick=function(){location.reload();};var r2=document.createElement("button");r2.className="btn btn-ghost";r2.textContent="Réparer (vider le cache)";r2.onclick=repair;var a=document.createElement("div");a.className="boot-actions";a.append(r1,r2);n.append(m,a);}setTimeout(check,15000);window.__vnBootCheck=check;})();</script>
