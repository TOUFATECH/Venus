# Mise à jour automatique de Venus sous Docker (optionnel).
# Lancer avec :  docker compose -f docker-compose.yml -f docker-compose.autoupdate.yml up -d
# Chaque nuit (4 h), ce petit compagnon regarde si GitHub a du nouveau ; si oui, il met à jour le dossier
# et reconstruit Venus (quelques minutes, Venus redémarre). Il a besoin du dossier de Venus et du Docker de l'hôte.
services:
  venus-autoupdate:
    image: docker:cli
    container_name: venus-autoupdate
    restart: unless-stopped
    environment:
      - VENUS_DIR=/opt/Venus
      - UPDATE_HOUR=4
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/Venus:/opt/Venus
    working_dir: /opt/Venus
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache git >/dev/null 2>&1
        git config --global --add safe.directory "$$VENUS_DIR"
        echo "[autoupdate] prêt : vérification chaque jour à $${UPDATE_HOUR}h"
        while true; do
          if [ "$$(date +%H | sed 's/^0//')" = "$$UPDATE_HOUR" ]; then
            git fetch -q origin main
            if [ "$$(git rev-parse HEAD)" != "$$(git rev-parse origin/main)" ]; then
              echo "[autoupdate] nouvelle version : mise à jour…"
              git pull -q --ff-only && docker compose -f "$$VENUS_DIR/docker-compose.yml" up -d --build venus && echo "[autoupdate] Venus mis à jour"
            fi
            sleep 3600
          fi
          sleep 600
        done
