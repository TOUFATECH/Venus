# Exemples d'accélération matérielle. install.sh génère le bon fichier tout seul ;
# pour le faire à la main, copiez le bloc qui correspond à votre machine dans docker-compose.override.yml

# --- Intel (Quick Sync) ou AMD : processeurs Intel récents, la plupart des NAS (Synology, QNAP…), mini-PC
services:
  venus:
    devices:
      - /dev/dri:/dev/dri

