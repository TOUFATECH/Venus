# Tests de Venus à chaque envoi : analyse du code, construction de l'interface Next.js, tests dans un vrai navigateur
# (ordinateur, téléphone, télécommande) et construction de l'image Docker.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: Analyse du code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Outils
        working-directory: tests
        run: npm ci --no-audit --no-fund
      - name: Variables inconnues, code inatteignable, règles React
        working-directory: tests
        run: npm run analyse

  navigateur:
    name: Pages et parcours (navigateur)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tests/package-lock.json
      - name: ffmpeg (analyse et lecture des vidéos)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Construction de l'interface Next.js
        run: npm run web:build
      - name: Outils de test
        working-directory: tests
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Tests (ordinateur, téléphone, télécommande)
        working-directory: tests
        run: npx playwright test
      - name: Rapport des tests
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: rapport-des-tests
          path: |
            tests/playwright-report
            tests/test-results
          retention-days: 14

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Construction de l'image
        run: docker build -t venus:test .
      - name: Démarrage et interface Next.js servie
        run: |
          docker run -d --name venus -p 8096:8096 venus:test
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8096/api/status >/dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:8096/api/status
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8096/ | grep -q '/_next/static/' && ok=1 && break; sleep 1; done
          if [ -z "$ok" ]; then echo "L'interface Next.js n'est pas servie"; docker logs venus; exit 1; fi
          echo "Interface Next.js servie par l'image Docker"
      - name: Journal du conteneur
        if: always()
        run: docker logs venus 2>&1 | tail -50
