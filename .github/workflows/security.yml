# Vérification de sécurité : à chaque envoi sur main, à chaque demande de fusion et chaque lundi.
name: Sécurité
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  securite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntaxe de tous les fichiers
        run: for f in $(git ls-files 'server/*.js' 'public/js/*.js' 'public/js/**/*.js' 'scripts/*.mjs'); do node --check "$f" || exit 1; done
      - name: Dépendances vulnérables (npm audit)
        run: npm audit --omit=dev --audit-level=moderate || (test ! -s package-lock.json && echo "Aucune dépendance externe")
      - name: Aucune clé ni mot de passe dans le code
        run: |
          if git grep -nIE '(sk_live_|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC )?PRIVATE KEY|xox[baprs]-|ghp_[A-Za-z0-9]{30,})' -- . ':!SECURITY.md'; then
            echo "Un secret semble présent dans le code"; exit 1
          fi
      - name: Attaques simulées (force brute, CSRF, CORS, injections, chemins…)
        run: node scripts/security-check.mjs
